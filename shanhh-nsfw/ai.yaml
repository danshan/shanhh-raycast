instructions: |
  你是一个 JavBus 搜索工具. 搜索列表时使用 search-javbus-list.
  获取详情时, 必须先使用 search-javbus-list, 再把返回结果中的详情 URL 传给 get-javbus-detail.
  获取磁力链接时, 必须依次使用 search-javbus-list, get-javbus-detail 和 search-javbus-magnet-list.
  detailUrl 和 magnetSearchUrl 必须来自前序 Tool 的返回值, 不得猜测或自行构造 URL.
evals:
  - input: "@shanhh-nsfw 搜索 jav SSNI-001"
    expected:
      - callsTool:
          name: search-javbus-list
          arguments:
            type: "有码"
            searchText: "SSNI-001"
  - input: "@shanhh-nsfw 搜索 jav 的有码影片 SSNI-001"
    expected:
      - callsTool:
          name: search-javbus-list
          arguments:
            type: "有码"
            searchText: "SSNI-001"
  - input: "@shanhh-nsfw 搜索 javbus 的 SSNI-001"
    expected:
      - callsTool:
          name: search-javbus-list
          arguments:
            type: "有码"
            searchText: "SSNI-001"
  - input: "@shanhh-nsfw 搜索影片 SSNI-001"
    expected:
      - callsTool:
          name: search-javbus-list
          arguments:
            type: "有码"
            searchText: "SSNI-001"
  - input: "@shanhh-nsfw 搜索 jav 的无码影片 SSNI-001"
    expected:
      - callsTool:
          name: search-javbus-list
          arguments:
            type: "无码"
            searchText: "SSNI-001"
  - input: "@shanhh-nsfw 搜索 jav 影片 SSNI-001 的详情"
    mocks:
      search-javbus-list:
        - url: "https://www.javbus.com/SSNI-001"
          code: "SSNI-001"
          thumbnail: "https://www.javbus.com/placeholder.jpg"
          title: "Example"
          date: "2024-01-01"
          tags: []
    expected:
      - callsTool:
          name: search-javbus-list
          arguments:
            type: "有码"
            searchText: "SSNI-001"
      - callsTool:
          name: get-javbus-detail
          arguments:
            url: "https://www.javbus.com/SSNI-001"
  - input: "@shanhh-nsfw 搜索 jav 影片 SSNI-001 的磁力链接"
    mocks:
      search-javbus-list:
        - url: "https://www.javbus.com/SSNI-001"
          code: "SSNI-001"
          thumbnail: "https://www.javbus.com/placeholder.jpg"
          title: "Example"
          date: "2024-01-01"
          tags: []
      get-javbus-detail:
        url: "https://www.javbus.com/SSNI-001"
        magnetSearchUrl: "https://www.javbus.com/ajax/uncledatoolsbyajax.php?gid=1&lang=zh&img=placeholder.jpg&uc=0"
    expected:
      - callsTool:
          name: search-javbus-list
          arguments:
            type: "有码"
            searchText: "SSNI-001"
      - callsTool:
          name: get-javbus-detail
          arguments:
            url: "https://www.javbus.com/SSNI-001"
      - callsTool:
          name: search-javbus-magnet-list
          arguments:
            detailUrl: "https://www.javbus.com/SSNI-001"
            magnetSearchUrl: "https://www.javbus.com/ajax/uncledatoolsbyajax.php?gid=1&lang=zh&img=placeholder.jpg&uc=0"
